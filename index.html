<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermeladas Caseras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf5ec; --card:#ffffff; --ink:#3b2418; --muted:#7a6457;
    --berry:#8e1f3b; --berry-dark:#6d1529; --gold:#c9963b; --green:#2f6b3a;
    --line:#ecdfcf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 48px}
  header{text-align:center;padding:8px 0 20px}
  .emoji{font-size:44px;line-height:1}
  h1{font-size:30px;margin:8px 0 4px;color:var(--berry);font-weight:800}
  .sub{margin:0;color:var(--muted);font-size:17px}
  .btn{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:#fff;
       background:var(--berry);border:0;border-radius:18px;padding:20px 18px;margin:0 0 14px;
       font:800 20px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer;
       box-shadow:0 4px 0 var(--berry-dark)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-dark)}
  .btn .ico{font-size:30px;flex:none}
  .btn small{display:block;font-weight:400;font-size:15px;opacity:.9}
  .btn.green{background:var(--green);box-shadow:0 4px 0 #1f4a27}
  .btn.gold{background:var(--gold);box-shadow:0 4px 0 #9c722a}
  .hidden{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:6px}
  .card h2{margin:0 0 6px;font-size:22px;color:var(--berry)}
  .card p{margin:0 0 14px;color:var(--muted);font-size:16px}
  label{font-weight:700;font-size:16px;display:block;margin-bottom:6px}
  input{width:100%;font:400 20px Nunito,system-ui,sans-serif;padding:14px;border:2px solid var(--line);border-radius:12px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--berry)}
  canvas{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="emoji">🍓</div>
    <h1>Mermeladas Caseras</h1>
    <p class="sub"><b>Tu área de miembros</b><br>Todo tu material está aquí. Toca cada botón 👇</p>
  </header>

  <a class="btn" href="https://drive.google.com/drive/folders/1tQkBD6ly8g4VAtn9dY4H1Iwi6d0XSpC2?usp=sharing" target="_blank" rel="noopener">
    <span class="ico">📚</span><span>Recetas y guías<small>Todo tu material de mermeladas</small></span>
  </a>

  <a class="btn" href="https://drive.google.com/drive/folders/1dzkOKWZBle8kXIVO7yTLMp9oq00bgvqe?usp=sharing" target="_blank" rel="noopener">
    <span class="ico">🎥</span><span>Videoclases<small>Paso a paso, para ver en tu celular</small></span>
  </a>

  <a class="btn green" id="grupo" href="https://chat.whatsapp.com/DnZDGhKclbPLCA99rPy3Y5?s=sw&amp;p=i&amp;ilr=0" target="_blank" rel="noopener">
    <span class="ico">👥</span><span>Grupo VIP<small>Entra al grupo de WhatsApp</small></span>
  </a>

  <a class="btn gold" href="certificado">
    <span class="ico">🎓</span><span>Mi certificado<small>Escribe tu nombre y descárgalo</small></span>
  </a>


  <footer>Hecho con amor por Alicia 💛</footer>
</main>

</body>
</html>
